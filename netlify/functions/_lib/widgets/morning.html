<style>
body{margin:0;padding:12px 14px;font:13px/1.35 system-ui,sans-serif;color:var(--x);-webkit-user-select:none;user-select:none}
.t{display:flex;justify-content:space-between;align-items:center;font:600 15px system-ui,sans-serif}
.t i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--a);margin-right:8px;vertical-align:1px}
.t em{font:400 13px system-ui,sans-serif;color:var(--h)}
#B{margin-top:10px;padding:7px 10px;border-radius:10px;background:var(--s);font-weight:500}
.n{font-size:34px;font-weight:700;letter-spacing:-.6px;margin-top:10px;font-variant-numeric:tabular-nums}
.n small{font-size:15px;font-weight:500;letter-spacing:0;color:var(--h);margin-left:6px}
.c{color:var(--h)}.c b{color:var(--e);font-weight:600}
#T{position:relative;height:48px;margin:12px 8px 0}
#T:before{content:'';position:absolute;left:0;right:0;top:19px;height:2px;border-radius:1px;background:var(--l)}
.d{position:absolute;top:10px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--a);color:#fff;font:600 11px/20px system-ui,sans-serif;text-align:center;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.6,.5,1),background .3s}
.go .d{transform:none}.d.p{background:var(--m)}
.x{position:absolute;top:33px;font-size:10px;color:var(--h);transform:translateX(-50%)}
#M{position:absolute;top:4px;height:30px;width:2px;margin-left:-1px;border-radius:1px;background:var(--x);transition:left .6s}
#M:after{content:'';position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--x);animation:q 1.6s ease-out infinite}
@keyframes q{from{box-shadow:0 0 0 0 rgba(140,140,140,.6)}to{box-shadow:0 0 0 9px rgba(140,140,140,0)}}
.ch{display:inline-block;margin-top:10px;padding:2px 9px;border-radius:9px;background:var(--s);font-size:12px;color:var(--h)}
.g{position:relative;display:flex;background:var(--s);border-radius:10px;padding:3px;margin:12px 0 8px}
.g button{flex:1;position:relative;z-index:1;border:0;background:none;padding:6px 0;font:500 13px system-ui,sans-serif;color:var(--h)}
.g button.on{color:var(--x)}
.g u{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:8px;background:var(--b);box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.P{display:grid}.P>div{grid-area:1/1;opacity:0;visibility:hidden;transition:opacity .25s}.P>div.on{opacity:1;visibility:visible}
.r{display:grid;grid-template-columns:1fr 88px 34px;gap:8px;align-items:center;min-height:26px;margin:0 -6px 2px;padding:0 6px;border-radius:8px}
.r.e{background:var(--et);color:var(--e)}
.k{height:6px;border-radius:3px;background:var(--l);overflow:hidden}
.k s{position:relative;display:block;height:100%;width:calc(var(--w)*100%);border-radius:3px;background:var(--a);overflow:hidden;transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.k s.e{background:var(--e)}.k b{position:absolute;top:0;right:0;bottom:0;background:rgba(0,0,0,.28)}
.on .k s{transform:none}
.m{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.u{font-size:12px;color:var(--h);margin:-4px 0 4px}
.w{display:flex;align-items:center;gap:8px;height:28px;white-space:nowrap;overflow:hidden}
.w span{color:var(--h);overflow:hidden;text-overflow:ellipsis}
.v{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 9px system-ui,sans-serif;background:var(--l)}
.l{padding:3px 0}
.f{margin-top:8px;font-size:12px;color:var(--h);white-space:pre-line}
</style>
<div class=t><span><i></i>План на день</span><em id=D></em></div>
<div id=B hidden></div>
<div class=n id=N></div>
<div class=c id=C></div>
<div id=T></div>
<div id=U></div>
<div class=g id=G><u></u><button class=on>Сьогодні</button><button>Воронка</button><button>Команда</button></div>
<div class=P id=P><div class=on id=P0></div><div id=P1></div><div id=P2></div></div>
<div class=f id=F></div>
<script>
const W=window.TelegramWidget||{onEvent(){}},$=i=>document.getElementById(i);
let D,k=0;
const pl=(n,a,b,c)=>{const t=n%100,u=n%10;return t>10&&t<15?c:u==1?a:u>1&&u<5?b:c};
const row=(l,v,w,e,o)=>'<div class="r'+(e?' e':'')+'"><span>'+l+'</span><div class=k><s'+(e?' class=e':'')+' style=--w:'+Math.max(w,.03)+'>'+(o?'<b style=width:'+o*100+'%></b>':'')+'</s></div><span class=m>'+v+'</span></div>';
const sub=t=>'<div class=u>'+t+'</div>';
const kyiv=o=>new Intl.DateTimeFormat('en-CA',Object.assign({timeZone:'Europe/Kyiv'},o)).format(new Date());
const L=m=>(m-480)/720*100+'%';
function tick(){
  const p=kyiv({hour:'numeric',minute:'numeric',hourCycle:'h23'}).split(':'),m=+p[0]*60+ +p[1],on=kyiv({})===D.k&&m>=480&&m<=1200;
  $('M').style.display=on?'':'none';$('M').style.left=L(m);
  document.querySelectorAll('.d').forEach(d=>d.classList.toggle('p',on&&+d.dataset.m<m));
}
function init(){
  try{D=JSON.parse(W.chatData)}catch(e){return}
  const s=D.s,f=D.f,due=s[0]+s[1],ov=s[2]+s[3];
  $('D').textContent=D.d;$('B').hidden=!D.h;$('B').textContent=D.h;
  $('C').innerHTML=[ov?'<b>'+ov+' уже прострочено</b>':'',s[4]?s[4]+' '+pl(s[4],'правка','правки','правок')+' без відповіді':''].filter(Boolean).join(' · ')||'нічого не прострочено';
  let t='<div id=M></div>';for(let h=8;h<=20;h+=2)t+='<span class=x style=left:'+L(h*60)+'>'+h+'</span>';
  D.q.forEach((q,i)=>{t+='<span class=d data-m='+q[0]+' style="left:'+L(Math.min(1200,Math.max(480,q[0])))+';transition-delay:'+(200+i*90)+'ms">'+(q[1]>1?q[1]:'')+'</span>'});
  $('T').innerHTML=t;$('T').style.display=D.q.length?'':'none';
  $('U').innerHTML=D.q.length||s[1]?(s[1]?'<span class=ch>+ '+s[1]+' '+pl(s[1],'макет','макети','макетів')+' на сьогодні, без часу</span>':''):'<span class=ch>Дедлайнів на сьогодні немає</span>';
  const a=[['Дедлайни прорахунків',s[0]],['Дедлайни макетів',s[1]],['Прострочено прорахунків',s[2],1],['Прострочено макетів',s[3],1],['Правки без відповіді',s[4]]].filter(r=>r[1]),am=Math.max(1,...a.map(r=>r[1]));
  $('P0').innerHTML=a.map(r=>row(r[0],r[1],r[1]/am,r[2])).join('')||'<div class=l>Нічого термінового 🌤</div>';
  const fm=Math.max(1,f[0],f[3],f[4]);
  $('P1').innerHTML=row('На погодженні',f[0],f[0]/fm,0,f[0]?f[1]/f[0]:0)+(f[1]?sub('старші за '+D.S[0]+' днів: '+f[1]+(f[2]?' · найстарішому '+f[2]+' дн':'')):'')
    +row('Чекає відправки',f[3],f[3]/fm)+row('Нових за місяць',f[4],f[4]/fm)+(D.fm?sub('на '+D.fm):'')
    +(f[6]?row('Ліди без руху',f[5],f[5]/f[6],1)+sub(D.S[1]+'+ днів, з '+f[6]+' за квартал'):'');
  $('P2').innerHTML=D.o.map(o=>{const n=o[0].split(' ');return '<div class=w><span class=v>'+n[0][0]+(n[1]||'')[0]+'</span>'+o[0]+'<span>'+o[1]+'</span></div>'}).join('')
    +D.t.map(l=>'<div class=l>'+l+'</div>').join('')||'<div class=l>Уся команда на місці</div>';
  $('F').textContent=D.x;
  const n0=performance.now(),go=n=>{const p=Math.min(1,Math.max(0,(n-n0)/700));$('N').innerHTML=Math.round(due*(1-Math.pow(1-p,3)))+'<small>'+pl(due,'дедлайн','дедлайни','дедлайнів')+' сьогодні</small>';if(p<1)requestAnimationFrame(go)};
  requestAnimationFrame(go);requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('go')));
  tick();
}
$('G').addEventListener('click',e=>{
  const b=e.target.closest('button'),j=[...$('G').children].indexOf(b)-1;if(!b||j===k)return;k=j;
  $('G').firstChild.style.transform='translateX('+j*100+'%)';
  [...$('G').querySelectorAll('button')].forEach((x,i)=>x.classList.toggle('on',i===j));
  [...$('P').children].forEach((x,i)=>x.classList.toggle('on',i===j));
  W.HapticFeedback&&W.HapticFeedback.selectionChanged();
});
setInterval(()=>D&&tick(),30000);
W.onEvent('chatDataChanged',init);init();W.ready&&W.ready();
</script>
