<style>
:root{--a:#E6007E;--e:#e5484d;--w:#d98a00;--h:var(--tg-theme-hint-color,#8a8a8e);--s:var(--tg-theme-secondary-bg-color,#f1f1f4);--x:var(--tg-theme-text-color,#000);--b:var(--tg-theme-bg-color,#fff)}
body{margin:0;padding:12px 14px;font:13px/1.35 system-ui,sans-serif;color:var(--x);-webkit-user-select:none;user-select:none}
.t{display:flex;justify-content:space-between;align-items:center;font:600 15px system-ui,sans-serif}
.t i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--a);margin-right:8px;vertical-align:1px}
.t em{font:400 13px system-ui,sans-serif;color:var(--h)}
.sum{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.sum span{padding:3px 9px;border-radius:9px;background:var(--s);font-size:12px;color:var(--h)}.sum b{color:var(--x);font-weight:600}
.sum span.e{background:rgba(229,72,77,.12);color:var(--e)}.sum span.e b{color:var(--e)}
.h{display:flex;align-items:center;gap:8px;margin-top:10px;padding:6px 0;font-size:12px;color:var(--h);font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.g{border-bottom:1px solid var(--s)}.g:last-child{border:0}
.gh{display:flex;align-items:center;gap:9px;padding:8px 0}
.av{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 11px system-ui,sans-serif;color:#fff}
.gh b{flex:1;font-weight:600}.gh .bar{width:64px;height:6px;border-radius:3px;background:var(--s);overflow:hidden}.gh .bar s{display:block;height:100%;background:var(--a);border-radius:3px}
.gh .n{min-width:18px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.gh:after{content:'›';color:var(--h);transition:transform .25s;margin-left:2px}.g.on .gh:after{transform:rotate(90deg)}
.gb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}.gb>div{overflow:hidden}.g.on .gb{grid-template-rows:1fr}
.flat .gb{grid-template-rows:1fr}
.r{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--s)}
.flat .r:first-child{border:0}
.lg{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 11px system-ui,sans-serif;color:#fff;background:#65aadd;background-size:cover}
.r .m{flex:1;min-width:0}.r .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .m span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--h);font-variant-numeric:tabular-nums}
.d{flex:none;padding:2px 7px;border-radius:7px;font-size:11px;font-weight:600;background:var(--s)}
.p{flex:none;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.p.e{color:var(--e)}.p.w{color:var(--w)}
.r:after{content:'›';color:var(--h)}
</style>
<div class=t><span><i></i><span id=T></span></span><em id=D></em></div>
<div class=sum id=S></div>
<div id=L></div>
<script>
const W=window.TelegramWidget||{onEvent(){}},$=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const DOC={c:'договір',s:'СП',i:'рахунок',b:'доплата'},DP={c:['договір','договори','договорів'],s:['СП','СП','СП'],i:['рахунок','рахунки','рахунків'],b:['доплата','доплати','доплат']},pl=(n,f)=>f[n%10==1&&n%100!=11?0:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?1:2],SEC={u:'не надіслано',r:'повернули',n:'не підписано',p:'не оплачено'};
const COL=['#e17076','#7bc862','#65aadd','#a695e7','#ee7aae','#6ec9cb','#faa774'];
let D;
const ini=s=>s.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const row=(r,showSec)=>{const[id,num,cust,doc,sec,det,esc5,logo]=r;
  return '<div class=r data-u="'+esc(D.u+id)+'"><span class=lg'+(logo>=0?' style="background:var(--lg) '+(-logo*30)+'px 0/'+D.n*30+'px 30px;color:transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"':' style=background:'+COL[cust.length%7])+'>'+esc(ini(cust))+'</span><div class=m><b>'+esc(cust)+'</b><span>'+esc(num)+(showSec&&sec!='u'?' · '+SEC[sec]:'')+'</span></div><span class=d>'+DOC[doc]+'</span><span class="p'+(esc5?' e':'')+'">'+esc(det)+'</span></div>'};
function init(){
  D=window.DN;if(!D)try{D=JSON.parse(W.chatData)}catch(e){return}
  $('T').textContent=D.t;$('D').textContent=D.d;
  const all=D.g.flatMap(g=>g[1]),late=all.filter(r=>r[6]).length,cnt={};
  all.forEach(r=>cnt[r[3]]=(cnt[r[3]]||0)+1);const sc={};all.forEach(r=>sc[r[4]]=(sc[r[4]]||0)+1);
  $('S').innerHTML=(late?'<span class=e><b>'+late+'</b> довше 5 р.д.</span>':'')+(D.m?Object.entries(sc).map(([k,v])=>'<span><b>'+v+'</b> '+SEC[k]+'</span>').join(''):'')+Object.entries(cnt).map(([k,v])=>'<span><b>'+v+'</b> '+pl(v,DP[k])+'</span>').join('');
  if(D.m){ // керівнику: за менеджерами
    const max=Math.max(...D.g.map(g=>g[1].length));
    $('L').innerHTML=D.g.map((g,i)=>'<div class="g'+(i?'':' on')+'"><div class=gh><span class=av style="'+(g[2]>=0?'background:var(--av) '+(-g[2]*26)+'px 0/'+D.k*26+'px 26px;color:transparent':'background:'+COL[i%7])+'">'+esc(ini(g[0]))+'</span><b>'+esc(g[0])+'</b><span class=bar><s style=width:'+g[1].length/max*100+'%></s></span><span class=n>'+g[1].length+'</span></div><div class=gb><div>'+g[1].map(r=>row(r,1)).join('')+'</div></div></div>').join('');
  }else{ // менеджеру: за розділами
    $('L').innerHTML=D.g.map(g=>'<div class=h>'+esc(g[0])+' · '+g[1].length+'</div><div class=flat><div class=gb><div>'+g[1].map(r=>row(r,0)).join('')+'</div></div></div>').join('');
  }
}
document.addEventListener('click',e=>{
  const gh=e.target.closest('.gh');
  if(gh){const g=gh.parentNode;document.querySelectorAll('.g.on').forEach(o=>o!==g&&o.classList.remove('on'));g.classList.toggle('on');W.HapticFeedback&&W.HapticFeedback.selectionChanged();return}
  const r=e.target.closest('[data-u]');if(r&&W.openLink)W.openLink(r.dataset.u);
});
W.onEvent('chatDataChanged',init);init();W.ready&&W.ready();
</script>
