<style>
body{margin:0;padding:12px 14px;font:13px/1.35 system-ui,sans-serif;color:var(--x);-webkit-user-select:none;user-select:none}
.t{display:flex;justify-content:space-between;align-items:center;font:600 15px system-ui,sans-serif}
.t i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--a);margin-right:8px;vertical-align:1px}
.t em{font:400 13px system-ui,sans-serif;color:var(--h)}
.sum{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.sum span{padding:3px 9px;border-radius:9px;background:var(--s);font-size:12px;color:var(--h)}.sum b{color:var(--x);font-weight:600}
.sum span.e{background:var(--et);color:var(--e)}.sum span.e b{color:var(--e)}
.h{margin-top:10px;padding:6px 0;font-size:12px;color:var(--h);font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.g{border-bottom:1px solid var(--l)}.g:last-child{border:0}
.gh{display:flex;align-items:center;gap:9px;padding:8px 0}
.av{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 10px system-ui,sans-serif;background:var(--l)}
.gh b{flex:1;font-weight:600}.gh .bar{width:64px;height:6px;border-radius:3px;background:var(--l);overflow:hidden}.gh .bar s{display:block;height:100%;background:var(--a);border-radius:3px}
.gh .n{min-width:18px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.gh:after{content:'›';color:var(--h);transition:transform .25s;margin-left:2px}.g.on .gh:after{transform:rotate(90deg)}
.r{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--l)}
.lg{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 11px system-ui,sans-serif;background:var(--l);background-size:cover}
.r .m{flex:1;min-width:0}.r .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .m span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--h);font-variant-numeric:tabular-nums}
.d{flex:none;padding:2px 7px;border-radius:7px;font-size:11px;font-weight:600;background:var(--s)}
.p{flex:none;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.p.e{color:var(--e)}
.r:after{content:'›';color:var(--h)}
.z{padding:7px 0 2px;border-top:1px solid var(--l);font-size:12px;color:var(--h)}
.q{display:flex;justify-content:center;align-items:center;gap:12px;padding:6px 0 4px;border-top:1px solid var(--l);font-size:12px;color:var(--h);font-variant-numeric:tabular-nums}
.q button{border:0;background:var(--s);color:var(--x);width:36px;height:26px;border-radius:8px;font:600 15px system-ui,sans-serif}
.q button:disabled{color:var(--m)}
.q button{display:inline-grid;place-items:center;vertical-align:middle}.q button:before{content:'';width:6px;height:6px;border:solid currentColor;border-width:0 0 2px 2px;margin-left:3px;transform:rotate(45deg)}.q button[data-v="1"]:before{margin:0 3px 0 0;transform:rotate(-135deg)}
</style>
<div class=t><span><i></i><span id=T></span></span><em id=D></em></div>
<div class=sum id=S></div>
<div id=L></div>
<script>
const W=window.TelegramWidget||{onEvent(){}},$=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const DOC={c:'договір',s:'СП',i:'рахунок',b:'доплата'},DP={c:['договір','договори','договорів'],s:['СП','СП','СП'],i:['рахунок','рахунки','рахунків'],b:['доплата','доплати','доплат']},pl=(n,f)=>f[n%10==1&&n%100!=11?0:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?1:2],SEC={u:'не надіслано',r:'повернули',n:'не підписано',p:'не оплачено'};
// Усередині віджета Telegram нічого не скролить, а все нижче 600 px обрізається.
// Тому список ділиться на сторінки. Висоти заміряні на стенді (scripts/telegram-widgets-harness.mts):
// рядок 49, менеджер 43, заголовок розділу 38, гортання 37, «ще N» 27. H — місце під список —
// рахується в init з числа рядків плашок угорі (28 px кожен): що їх більше, то менше лишається.
let D,H,AV,LG,op=0,pg=0;
const ini=s=>s.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const tot=g=>g[3]||g[1].length;
const row=(r,showSec)=>{const[id,num,cust,doc,sec,det,late,logo]=r;
  return '<div class=r data-u="'+esc(D.u+id)+'"><span class=lg'+(logo>=0?' style="background:'+LG+' '+(-logo*30)+'px 0/'+D.n*30+'px 30px;color:transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"':'')+'>'+esc(ini(cust))+'</span><div class=m><b>'+esc(cust)+'</b><span>'+esc(num)+(showSec&&sec!='u'?' · '+SEC[sec]:'')+'</span></div><span class=d>'+DOC[doc]+'</span><span class="p'+(late?' e':'')+'">'+esc(det)+'</span></div>'};
const pager=n=>'<div class=q><button data-v=-1'+(pg?'':' disabled')+'></button><span>'+(pg+1)+' з '+n+'</span><button data-v=1'+(pg<n-1?'':' disabled')+'></button></div>';
const more=n=>n>0?'<div class=z>ще '+n+' — у CRM</div>':'';
function init(){
  D=Object.assign({},window.DN);try{Object.assign(D,JSON.parse(W.chatData))}catch(e){}
  if(!D.g)return;
  // Аватарки й лого — один base64-потік: початок v у chat_data, хвіст w у коді; перші c знаків — аватарки.
  const I=(D.v||'')+(D.w||''),u=b=>'url(data:image/webp;base64,'+b+')';AV=u(I.slice(0,D.c));LG=u(I.slice(D.c));
  $('T').textContent=D.t;$('D').textContent=D.d;
  const[late,sc,cnt]=D.s;
  $('S').innerHTML=(late?'<span class=e><b>'+late+'</b> довше 5 р.д.</span>':'')+(D.m?Object.entries(sc).map(([k,v])=>'<span><b>'+v+'</b> '+SEC[k]+'</span>').join(''):'')+Object.entries(cnt).map(([k,v])=>'<span><b>'+v+'</b> '+pl(v,DP[k])+'</span>').join('');
  // Ширину плашок рендерер не віддає — оцінюємо за довжиною тексту (6.4 px на знак, 300 px у рядку).
  H=540-28*Math.ceil([...$('S').children].reduce((a,c)=>a+c.textContent.length*6.4+24,0)/300);
  draw();
}
function draw(){
  let h,n=1;
  if(D.m){ // керівнику: за менеджерами, розкритий один
    const max=Math.max(...D.g.map(tot));
    h=D.g.map((g,i)=>{
      let b='';
      if(i===op){
        const R=g[1],room=H-D.g.length*43-(tot(g)>R.length?27:0),per=R.length*49<=room?R.length:Math.max(2,(room-37)/49|0);
        n=Math.ceil(R.length/per);pg=Math.min(pg,n-1);
        b=R.slice(pg*per,pg*per+per).map(r=>row(r,1)).join('')+(pg===n-1?more(tot(g)-R.length):'')+(n>1?pager(n):'');
      }
      return '<div class="g'+(i===op?' on':'')+'"><div class=gh data-g='+i+'><span class=av'+(g[2]>=0?' style="background:'+AV+' '+(-g[2]*26)+'px 0/'+D.k*26+'px 26px;color:transparent"':'')+'>'+esc(ini(g[0]))+'</span><b>'+esc(g[0])+'</b><span class=bar><s style=width:'+tot(g)/max*100+'%></s></span><span class=n>'+tot(g)+'</span></div>'+b+'</div>'}).join('');
  }else{ // менеджеру: за розділами, сторінка набирається за висотою
    const E=[],P=[[]];let y=0,rest=0,hs=0;
    D.g.forEach((g,i)=>{rest+=tot(g)-g[1].length;hs+=g[1].length>0;g[1].forEach((r,j)=>E.push([i,row(r,0),!j]))});
    const room=H-(rest?27:0),lim=E.length*49+hs*38<=room?1e9:room-37;
    E.forEach(([i,html,first])=>{
      let need=49+(first||!y?38:0);
      if(y+need>lim){P.push([]);y=0;need=87}
      if(need>49)P[P.length-1].push('<div class=h>'+esc(D.g[i][0])+' · '+tot(D.g[i])+'</div>');
      P[P.length-1].push(html);y+=need});
    n=P.length;pg=Math.min(pg,n-1);
    h=P[pg].join('')+(pg===n-1?more(rest):'')+(n>1?pager(n):'');
  }
  $('L').innerHTML=h;
}
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]'),g=e.target.closest('[data-g]'),r=e.target.closest('[data-u]'),f=W.HapticFeedback;
  if(v){pg=Math.max(0,pg+ +v.dataset.v);f&&f.selectionChanged();draw();return}
  if(g){const i=+g.dataset.g;op=i===op?-1:i;pg=0;f&&f.selectionChanged();draw();return}
  if(r&&W.openLink)W.openLink(r.dataset.u);
});
W.onEvent('chatDataChanged',init);init();W.ready&&W.ready();
</script>
