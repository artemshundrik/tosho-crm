<style>
body{margin:0;padding:12px 12px 10px;font:13px/1.3 system-ui,sans-serif;color:var(--x);-webkit-user-select:none;user-select:none}
.t{display:flex;justify-content:space-between;align-items:center;font:600 15px system-ui,sans-serif}
.t i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--a);margin-right:8px;vertical-align:1px}
.t em{font:400 13px system-ui,sans-serif;color:var(--h)}
#H{height:52px;margin-top:8px}
.n{font-size:30px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.n small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--h);margin-left:6px}
.c{color:var(--h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{display:grid;grid-template-columns:102px 1fr 38px;gap:0 8px;align-items:center;height:28px;padding:0 4px;margin:0 -4px;border-radius:8px;transition:background .2s}
.r.g{height:auto}.r.on{background:var(--s)}.dt{display:none;padding:0 0 4px 32px;font-size:12px;color:var(--h)}.dt.on{display:block}
.p{display:flex;align-items:center;gap:6px;min-width:0}
.p b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{flex:none;width:22px;height:22px;border-radius:50%;background:var(--l);background-size:auto 100%;display:grid;place-items:center;font:600 9px system-ui,sans-serif}
.k{position:relative;height:6px;border-radius:3px;background:var(--l);overflow:hidden}
.k s{position:absolute;top:0;bottom:0;background:var(--a);transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.go .k s{transform:none}
.m{text-align:right;font-variant-numeric:tabular-nums}
#G{position:relative;height:36px;margin-top:8px}
#G u{position:absolute;bottom:0;border-radius:1.5px 1.5px 0 0;background:rgba(230,0,126,.3);height:0;transition:height .45s cubic-bezier(.2,.8,.2,1)}
.x{position:relative;height:14px;font-size:10px;color:var(--h);margin-bottom:2px}
.x span{position:absolute;transform:translateX(-50%)}
.q{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:6px;font-size:12px;color:var(--h);font-variant-numeric:tabular-nums}
.q button{border:0;background:var(--s);color:var(--x);width:36px;height:26px;border-radius:8px;font:600 15px system-ui,sans-serif}
.q button:disabled{color:var(--m)}
.f{margin-top:8px;padding-top:6px;border-top:1px solid var(--l);font-size:12px;color:var(--h)}
.f div{margin-top:2px}.f b{font-weight:500;color:var(--x)}
</style>
<div class=t><span><i></i>Команда вчора</span><em id=D></em></div>
<div id=H></div>
<div class="r g"><span></span><div id=G></div><span></span></div>
<div class="r g"><span></span><div class=x id=X></div><span></span></div>
<div id=L></div>
<div class=q id=Q hidden></div>
<div class=f id=F hidden></div>
<script>
const W=window.TelegramWidget||{onEvent(){}},$=i=>document.getElementById(i),N=72,B=24,A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
let D,P=[],sel=-1,pg=0,S=10;
const hm=m=>{m=Math.round(m);const h=m/60|0;return h?h+' г'+(m%60?' '+m%60+' хв':''):m+' хв'};
const clk=m=>(m/60|0)+':'+String(m%60).padStart(2,'0');
const dec=s=>{const o=[];for(const ch of s){const v=A.indexOf(ch);o.push(v>>4,v>>2&3,v&3)}return o};
function init(){
  try{D=JSON.parse(W.chatData)}catch(e){return}
  // Рядки, що не влізли в chat_data, і підсумкові рядки їдуть у самому HTML (DN).
  const E=window.DN||{},f=E.o||[];
  P=D.p.concat(E.p||[]).map(r=>({n:r[0],m:r[1],z:dec(r[2]),i:r[3],f:r[4],l:r[5],s:r[6]}));
  // Усередині віджета Telegram нічого не скролить: більше десяти людей — сторінками.
  // Сторінки рівні (17 людей — 6+6+5, а не 8+8+1): хвіст з одного рядка виглядає обривом.
  S=P.length>10?Math.ceil(P.length/Math.ceil(P.length/8)):10;pg=0;sel=-1;
  $('D').textContent=D.d;
  let x='';for(let h=0;h<=12;h+=2)x+='<span style=left:'+h/12*100+'%>'+(D.a+h)+'</span>';$('X').innerHTML=x;
  let g='';for(let i=0;i<B;i++)g+='<u style="left:'+i/B*100+'%;width:calc('+100/B+'% - 2px)"></u>';$('G').innerHTML=g;
  $('F').innerHTML=f.map(l=>'<div><b>'+l[0]+'</b> '+l[1]+'</div>').join('');$('F').hidden=!f.length;
  $('L').style.minHeight=P.length>S?S*28+'px':'';
  head();list();
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('go')));
  const t0=performance.now(),tick=n=>{const t=Math.min(1,Math.max(0,(n-t0)/800)),e=1-Math.pow(1-t,3);
    document.querySelectorAll('.m').forEach(b=>b.textContent=hm(b.dataset.m*e).replace(' хв',''));if(t<1)requestAnimationFrame(tick)};tick(t0);
}
function list(){
  const a=pg*S,n=P.length;
  $('L').innerHTML=P.slice(a,a+S).map((p,q)=>{
    const j=a+q;let k='',i=0;while(i<N){if(!p.z[i]){i++;continue}let e=i;while(e<N&&p.z[e])e++;k+='<s style="left:'+i/N*100+'%;width:'+(e-i)/N*100+'%;transition-delay:'+q*40+'ms"></s>';i=e}
    const nm=p.n.split(' '),v=p.i<0?'">'+nm[0][0]+(nm[1]||'')[0]:'background-image:var(--av);background-position:'+-22*p.i+'px 0">';
    return '<div class=r data-j='+j+'><span class=p><span class=v style="'+v+'</span><b>'+p.n+'</b></span><div class=k>'+k+'</div><span class=m data-m='+p.m+'>'+hm(p.m).replace(' хв','')+'</span></div><div class=dt data-k='+j+'>'+clk(p.f)+'–'+clk(p.l)+' · найдовше без перерви '+hm(p.s)+'</div>'}).join('');
  $('Q').hidden=n<=S;
  $('Q').innerHTML='<button data-v=-1'+(pg?'':' disabled')+'>‹</button><span>'+(a+1)+'–'+Math.min(a+S,n)+' з '+n+'</span><button data-v=1'+(a+S<n?'':' disabled')+'>›</button>';
  show();
}
function head(){
  const u=$('G').children,z=(q,i)=>q.z[3*i]+q.z[3*i+1]+q.z[3*i+2],cnt=[];
  for(let i=0;i<B;i++)cnt[i]=P.reduce((a,q)=>a+(z(q,i)>0),0);
  const mx=Math.max(...cnt),pk=cnt.indexOf(mx),tot=P.reduce((a,q)=>a+q.m,0),n=P.length,t=n%100,d=n%10;
  for(let i=0;i<B;i++)u[i].style.height=Math.max(cnt[i]/mx,.04)*100+'%';
  $('H').innerHTML='<div class=n>'+Math.round(tot/60)+' г<small>у CRM разом · '+n+' '+(t>10&&t<15?'людей':d==1?'людина':d>1&&d<5?'людини':'людей')+'</small></div><div class=c>найбільше людей одночасно о '+clk(D.a*60+pk*30)+' — '+mx+'</div>';
}
function show(){
  document.querySelectorAll('.r[data-j]').forEach(r=>r.classList.toggle('on',+r.dataset.j===sel));
  document.querySelectorAll('.dt').forEach(r=>r.classList.toggle('on',+r.dataset.k===sel));
}
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]'),r=e.target.closest('.r[data-j]'),h=W.HapticFeedback;
  if(v){const q=pg+ +v.dataset.v;if(q<0||q*S>=P.length)return;pg=q;sel=-1;h&&h.selectionChanged();list();return}
  if(!r)return;const j=+r.dataset.j;
  sel=j===sel?-1:j;h&&h.selectionChanged();show();
});
W.onEvent('chatDataChanged',init);init();W.ready&&W.ready();
</script>
