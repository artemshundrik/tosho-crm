<style>
body{margin:0;padding:20px 16px 16px;font:13px/1.4 system-ui,sans-serif;color:var(--x);text-align:center;-webkit-user-select:none;user-select:none}
.fx{font-size:24px;line-height:1;margin-bottom:10px}
.ic{width:52px;height:52px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;transform:scale(.6);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.go .ic{transform:none}
.ic.ok{background:#1fa350}.ic.no{background:#e5484d}
.ic svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.av{width:72px;height:72px;font:600 22px system-ui,sans-serif;background:var(--l) center/cover}
.n{font:700 44px/1 system-ui,sans-serif;color:var(--a);margin-bottom:2px}
.h{font:600 15px/1.3 system-ui,sans-serif}.h.ok{color:var(--ok)}.h.no{color:var(--e)}
.b{font:700 21px/1.25 system-ui,sans-serif;margin-top:2px}
.p{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.p span{padding:4px 10px;border-radius:10px;background:var(--s);font-size:12px}
.q{margin-top:12px;padding:9px 12px;border-radius:12px;background:var(--s);text-align:left}
.f{margin-top:12px;font-size:12px;color:var(--h)}
</style>
<div class=fx id=X></div><div class=ic id=I></div><div class=n id=N></div><div class=h id=H></div><div class=b id=B></div><div class=p id=P></div><div class=q id=Q></div><div class=f id=F></div>
<script>
const W=window.TelegramWidget||{onEvent(){}},$=i=>document.getElementById(i);
// Значок рішення — намальований, а не символ шрифту: «✓» у кожного клієнта свій.
const IC={ok:'M5 13.5l5 5L21 7.5',no:'M7 7l12 12M19 7L7 19'};
function init(){
  const D=window.DN;if(!D)return;
  const set=(i,v)=>{$(i).textContent=v||'';$(i).hidden=!v};
  // Емодзі через пробіл: letter-spacing зсунув би рядок від центру.
  set('X',D.x&&[...D.x].join(' '));set('N',D.n);set('B',D.b);set('Q',D.q?'«'+D.q+'»':'');set('F',D.f);
  set('H',D.h);$('H').className='h '+(D.k||'');
  const I=$('I');I.className='ic '+(D.k||'');
  if(D.a){I.classList.add('av');I.textContent=D.av?'':D.i;if(D.av)I.style.backgroundImage='var(--av)'}
  else if(IC[D.k])I.innerHTML='<svg viewBox="0 0 26 26"><path d="'+IC[D.k]+'"/></svg>';
  else I.textContent=D.i;
  $('P').innerHTML=(D.p||[]).map(t=>'<span>'+String(t).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';')+'</span>').join('');$('P').hidden=!(D.p||[]).length;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('go')));
}
init();W.ready&&W.ready();
</script>
