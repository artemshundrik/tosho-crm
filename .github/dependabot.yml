# Автооновлення залежностей.
#
# НАВІЩО. До 2026-08-19 механізму не було взагалі, і залежності тихо дрейфували:
# @supabase/supabase-js відстав на 25 мінорних версій, Radix на 8, tiptap на 7.
# Саме в мінорних їдуть виправлення й латки безпеки.
#
# ═══════════════════════════════════════════════════════════════════════
# ГОЛОВНЕ, ЩО ТУТ НЕОЧЕВИДНЕ: КОЖЕН ЗЛИТИЙ PR = ДЕПЛОЙ = ~15 КРЕДИТІВ
# ═══════════════════════════════════════════════════════════════════════
#
# Бюджет ≈40 деплоїв на місяць (docs/DEPLOY_POLICY.md). Щотижневий робот, чиї
# PR-и зливають кнопкою на GitHub, з'їв би 52 деплої на рік лише на оновлення —
# більше за цілий місячний бюджет. Звідси три рішення нижче.
#
# 1. РАЗ НА МІСЯЦЬ, А НЕ ЩОТИЖНЯ. Дванадцять PR-ів на рік замість п'ятдесяти.
#    Дата — 19-те о 19:00 (cron). interval: monthly сюди не годиться: він жорстко
#    ходить першого числа, і день у ньому не налаштовується.
#
# 2. УСЕ МІНОРНЕ Й ЛАТКИ — В ОДИН PR (groups). Двадцять оновлень коштують стільки
#    ж, скільки одне, якщо їдуть разом.
#
# 3. НЕ ЗЛИВАТИ КНОПКОЮ НА GITHUB. Кнопка «Merge» пушить у main і одразу палить
#    деплой. Правильно — забрати гілку локально й повезти в загальній пачці з
#    рештою роботи:
#        git fetch origin && git merge origin/dependabot/npm_and_yarn/<гілка>
#    Тоді оновлення не коштує нічого понад той пуш, який ти й так робив.
#    Автозлиття (automerge) не вмикаємо саме тому: воно палило б кредити мовчки.
#
# Прев'ю-збірки для цих PR-ів вимкнено запобіжником у netlify.toml — інакше
# кожен відкритий PR коштував би 15 кредитів ще до злиття. Перевіряє їх
# GitHub Actions, він безкоштовний.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Раз на місяць, 19-го о 19:00 за Києвом. Через cron, а не interval: monthly,
    # бо monthly жорстко прив'язаний до ПЕРШОГО числа й дня не вибереш.
    schedule:
      interval: cron
      cronjob: "0 19 19 * *"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(залежності)"
    labels: [залежності]

    # Усе безпечне — однією купкою.
    groups:
      мінорні-та-латки:
        patterns: ["*"]
        update-types: [minor, patch]

    ignore:
      # React закріплений НАВМИСНО. Перехід на 19 їде окремою карткою (REQ-58):
      # там два рядки коду, але ціна в проклацуванні 253 компонентів, і робити
      # це має людина, а не робот посеред купки оновлень.
      - dependency-name: react
      - dependency-name: react-dom

      # Мажорні версії — руками, поштучно й свідомо. Кожна тут має свою міну:
      # lucide-react 0.560 → 1.32, @vitejs/plugin-react 5 → 6,
      # pdfjs-dist 5 → 6, а react-day-picker 9 мовчки ламає стилі календаря —
      # старі імена класів там лишились у типах як @deprecated і в рантаймі не
      # діють, тож tsc буде зелений, а календар поїде (деталі в REQ-58).
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Версії самих GitHub Actions. Ці PR-и БЕЗКОШТОВНІ: зміни в .github/ більше не
  # запускають збірку Netlify (виняток у netlify.toml), тож їх можна зливати
  # кнопкою не думаючи.
  - package-ecosystem: github-actions
    directory: /
    # Того ж дня, що й npm: усе, що треба переглянути, приїжджає разом.
    schedule:
      interval: cron
      cronjob: "0 19 19 * *"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(actions)"
    labels: [залежності]
