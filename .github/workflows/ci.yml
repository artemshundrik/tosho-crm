# Перевірки перед злиттям і після пушу.
#
# НАВІЩО. До 2026-08-19 у проєкті не було жодної автоматичної перевірки: tsc,
# lint і тести запускались лише тоді, коли про них згадували руками — тоді тестів
# було 46, на 02.09.2026 їх 1918 у 139 файлах. Уже на першому запуску це виявило,
# що `typecheck:functions` зламаний на main і ніхто про це не знав.
#
# ЩО ЦЕЙ ФАЙЛ НЕ РОБИТЬ. Він НЕ зупиняє деплой. Netlify збирає з пушу
# паралельно й на результат Actions не дивиться. Реальний запобіжник перед
# витратою кредитів — гак scripts/hooks/pre-push, який ганяє те саме локально
# ще до того, як пуш пішов. Actions тут — мережа безпеки (коли гак обійшли
# через --no-verify або пуш стався з іншої машини) і обов'язкова умова для
# автооновлень залежностей: робот відкриває PR, а перевірки кажуть, чи він
# безпечний.
#
# ЧОМУ ВСІ КРОКИ ХОДЯТЬ ДО КІНЦЯ. `if: !cancelled()` не дає зупинитись на
# першій червоній перевірці: краще побачити всі поламані місця за один запуск,
# ніж лагодити їх по черзі, щоразу чекаючи новий.

name: Перевірки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Кілька пушів поспіль — рахуємо лише останній.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Типи, лінт, тести
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версія МАЄ збігатися з NODE_VERSION у netlify.toml: інакше перевірки
      # міряють не те, на чому насправді збирається прод, і зелений CI нічого
      # не гарантує. Міняєш там — міняй і тут.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Залежності
        run: npm ci

      - name: Типи застосунку
        run: npm run typecheck

      - name: Лінт
        if: ${{ !cancelled() }}
        run: npm run lint

      # ЄДИНЕ МІСЦЕ, ДЕ ЦЕ ГАНЯЄТЬСЯ АВТОМАТИЧНО (REQ-208). Ратчет боргу перед
      # React Compiler коштує ~90 с — усе, що лишилось від ESLint після переїзду
      # на oxlint. Локально в `npm run check` його немає навмисно: там ці 90 с
      # з'їдали б увесь виграш переїзду (106 с → 11 с). Тут хвилина безкоштовна.
      #
      # Наслідок, який треба знати: борг ловиться вже ПІСЛЯ пушу, паралельно з
      # деплоєм. Для ратчета швидкості це прийнятно — він стереже зайві проходи
      # рендеру, а не коректність. Руками перед пушем: `npm run check:compiler-debt`.
      - name: Борг компілятора
        if: ${{ !cancelled() }}
        run: npm run check:compiler-debt

      - name: Тести
        if: ${{ !cancelled() }}
        run: npm run test

      - name: Типи Netlify-функцій
        if: ${{ !cancelled() }}
        run: npm run typecheck:functions

      # Сценарії наскрізних перевірок (REQ-140) не входять у кореневий tsconfig.
      # Тут перевіряються лише ТИПИ — сам прогін живе в окремому робочому
      # процесі (e2e.yml) і пушів не блокує.
      - name: Типи наскрізних перевірок
        if: ${{ !cancelled() }}
        run: npm run typecheck:e2e

      - name: Реєстр Netlify-функцій
        if: ${{ !cancelled() }}
        run: npm run check:functions

      - name: Ключі фіч
        if: ${{ !cancelled() }}
        run: npm run check:feature-keys

      # Мапа великих файлів і числа в інструкціях (REQ-107). Теж ТІЛЬКИ тут, і
      # з тієї ж причини, що борг компілятора: протухла документація не ламає
      # прод, вона ламає НАСТУПНУ роботу, тож блокувати нею пуш безглуздо.
      #
      # Заміряно 29.08.2026: за чотири дні мапа розійшлася з кодом на +177
      # рядків у DesignTaskPage і на −1094 у DesignPage — тобто вела не туди,
      # а перевірки не існувало ніде. Агент, який їй вірить, читає не той шматок
      # десятитисячного файлу й робить висновки з чужого коду.
      #
      # Розійшлось — лагодиться одним рухом: npm run docs:sync
      - name: Документація не розійшлась із кодом
        if: ${{ !cancelled() }}
        run: npm run check:docs-drift
