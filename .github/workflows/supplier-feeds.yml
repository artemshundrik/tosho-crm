# Перезалив товарних фідів постачальників у пул tosho.supplier_products.
#
# НАВІЩО ВІН ТУТ, А НЕ В NETLIFY. Завантажувач пише в базу через `psql`
# (`scripts/load-supplier-feed.mjs`), а на Netlify psql немає — там лише HTTP.
# Переписувати запис на REST заради розкладу означало б завести другий шлях у
# ту саму таблицю, з іншими помилками й іншою поведінкою на конфліктах. Дешевше
# віддати розклад тому, у кого вже є і Node, і psql, і секрети. Плюс сторож CRM
# (`watchdog.yml`) з тієї ж причини живе тут — місце вже обжите.
#
# НАВІЩО ВЗАГАЛІ РОЗКЛАД. Фід Тотобі оновлюється щогодини, Аванпринт
# перегенерує свій профіль сам. Перезалив досі робився РУКАМИ з ноутбука, тобто
# ціни в базі тихо старіли, виглядаючи свіжими: у вікні пошуку немає нічого, що
# сказало б менеджеру «цій цифрі три тижні». Прорахунок за старою ціною
# помічають на погодженні, а не в CRM.
#
# ЩО САМЕ ГАНЯЄМО І ЧОМУ ПО-РІЗНОМУ. Файлові фіди (Тотобі, Аванпринт) — один
# запит і кілька мегабайт, їх не шкода й двічі на день. Беррітекс теж фід, але
# після нього йдуть ще 74 сторінки товару під логіном: у файлі роздріб, а наша
# ціна лише в кабінеті. Разом увесь денний прогін укладається у півтори хвилини,
# тож друга ходка нічого не коштує. Бергамо фіда не має взагалі: там обхід 2658
# сторінок товарів, тож раз на тиждень — і то з запасом, бо їхні сторінки не
# міняються щогодини.
#
# ⚠️ ЗАПОБІЖНИКИ ЖИВУТЬ У ЗАВАНТАЖУВАЧІ, А НЕ ТУТ — І ЦЕ НАВМИСНО.
# Небезпека така: зниклі товари гасяться за часом («усе, чого не торкнулись у
# цьому прогоні, — вимкнути»), тож порожній або обірваний прогін вимкнув би
# всього постачальника, а виглядало б це як «Аванпринт зник із пошуку» —
# причину шукали б у показі, а не в адресі вивантаження з непостійним хешем.
# У `load-supplier-feed.mjs` на це три рубежі: `curl -f` (404 падає вголос),
# `maxFailRatio` в обході (частковий обхід не доходить до запису) і `minRows`
# у реєстрі постачальника (нижня межа рядків).
#
# Перша редакція цього файлу ганяла кожного постачальника спершу `--dry` і
# звіряла з порогом тут. Пороги переїхали в реєстр — туди, де лежить решта
# даних про постачальника, — а суху пробіжку прибрано: для Бергамо вона
# означала б ДРУГИЙ обхід 2658 сторінок, тобто подвоєння півгодини роботи й
# навантаження на чужий сайт.
#
# СЕКРЕТИ. `SUPPLIER_FEED_DB_URL` — той самий рядок підключення, що в
# `.env.backup` під іменем `BACKUP_DB_URL`. Репозиторій ПУБЛІЧНИЙ, тож пароля в
# логу бути не повинно взагалі. Захист у три шари, і покладатись на один не
# можна: GitHub замальовує точне значення секрета сам, але будь-яке
# перетворення рядка це замальовування промахує; завантажувач більше не кладе
# підключення в аргументи `psql` (передає змінними оточення, тож у `e.message`
# із командою пароля просто немає); і весь вивід тут додатково проціджується
# через `hide` — на випадок, якщо рядок пролізе з боку, про який ми не подумали.

name: supplier-feeds

on:
  schedule:
    # Двічі на день: 10:00 і 17:00 за Києвом (влітку). Ранковий прогін дає
    # менеджеру свіжі ціни до початку роботи над прорахунками, денний ловить те,
    # що постачальники перезалили протягом дня, — у Тотобі фід оновлюється
    # щогодини, і до вечора ранкова цифра встигає постаріти.
    #
    # ЧОМУ ЧАС У ТЕКСТІ Й У КРОНІ НЕ ЗБІГАЄТЬСЯ. GitHub рахує в UTC і переходу
    # на літній час не знає, тож узимку прогони зсунуться на 09:00 і 16:00 за
    # Києвом. Це та сама плата, яку вже прийняли решта джобів
    # (`scripts/dev-news-cron.sql`, `scripts/finance-month-close-cron.sql`):
    # година для перезаливу цін некритична, а два рядки крона з місяцями замість
    # одного брехали б на межах переходу однаково.
    #
    # ⚠️ GitHub ТОЧНОСТІ НЕ ОБІЦЯЄ: спізнення на години — це норма, а не поломка.
    # 09.09.2026 нічний прогін відпрацював на 4 год 40 хв пізніше. Тому «о 10:00
    # ціни не оновились» саме по собі ще ні про що не каже — дивись прогони.
    - cron: "0 7 * * *"
    - cron: "0 14 * * *"
    # Неділя, 06:30 за Києвом — обхід Бергамо. Лишається нічним і тижневим: це
    # пів години обходу 2658 сторінок чужого сайту, і ганяти його двічі на день
    # означало б годину навантаження щодня заради сторінок, які так часто не
    # міняються.
    - cron: "30 3 * * 0"
  workflow_dispatch:
    inputs:
      suppliers:
        description: "Кого перезалити через пробіл (totobi berrytex avanprint bergamo e-suvenir papirus). Порожньо — усіх."
        required: false
        default: ""

permissions: {}

concurrency:
  group: supplier-feeds
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Токен для пушу цій задачі не потрібен: вона лише читає репозиторій.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Має збігатися з CI та NODE_VERSION у netlify.toml.
          node-version: "24"

      - name: Кого заливаємо
        id: pick
        env:
          # Через env, а не ${{ }} просто в тілі скрипта: вхід ручного запуску
          # пише людина, і підставляти його в shell дослівно не можна.
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ github.event.inputs.suppliers }}
        run: |
          set -euo pipefail
          known="totobi berrytex avanprint bergamo e-suvenir papirus"

          if [ -n "${REQUESTED:-}" ]; then
            # Ручний запуск: беремо лише знайомі імена, решту відкидаємо вголос.
            list=""
            for want in $REQUESTED; do
              ok=0
              for k in $known; do
                if [ "$want" = "$k" ]; then ok=1; fi
              done
              if [ "$ok" = "1" ]; then list="$list $want"; else echo "Невідомий постачальник, пропускаю: $want"; fi
            done
            if [ -z "$list" ]; then
              echo "::error::Жодного знайомого постачальника у вході."
              exit 1
            fi
          else
            case "${SCHEDULE:-}" in
              # Обидва денні прогони заливають те саме — різниця лише в годині.
              "0 7 * * *")  list="totobi berrytex avanprint e-suvenir papirus" ;;
              "0 14 * * *") list="totobi berrytex avanprint e-suvenir papirus" ;;
              "30 3 * * 0") list="bergamo" ;;
              *)            list="$known" ;;
            esac
          fi

          list=$(echo "$list" | tr -s ' ' | sed 's/^ //;s/ $//')
          echo "Заливаємо: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Залити фіди
        id: load
        env:
          BACKUP_DB_URL: ${{ secrets.SUPPLIER_FEED_DB_URL }}
          # Е-СУВЕНІР ХОДИТЬ ПІД ЛОГІНОМ, і без цих двох секретів його API
          # віддає ПУБЛІЧНІ ціни замість наших. Мовчазним це не буде: завантажувач
          # без них не стартує, а якщо логін відпаде посеред прогону — спрацює
          # межа частки рядків із нашою ціною. Решті постачальників облікові
          # дані не потрібні, тож порожні змінні їм не заважають.
          E_SUVENIR_EMAIL: ${{ secrets.E_SUVENIR_EMAIL }}
          E_SUVENIR_PASSWORD: ${{ secrets.E_SUVENIR_PASSWORD }}
          # БЕРРІТЕКС — ТОЙ САМИЙ ВИПАДОК, лише вхід інший: фід віддає роздріб, а
          # нашу ціну показує сайт під логіном. Без цих двох завантажувач не
          # стартує, бо роздріб ліг би в пул із підписом «оптова».
          BERRYTEX_EMAIL: ${{ secrets.BERRYTEX_EMAIL }}
          BERRYTEX_PASSWORD: ${{ secrets.BERRYTEX_PASSWORD }}
          # ПАПІРУС — ЗАКРИТИЙ ПОРТАЛ ЦІЛКОМ: без логіна там немає ні прайсу, ні
          # товарів, сама лише сторінка-візитівка. Тому тихого збою тут бути не
          # може — завантажувач падає на типі файлу, — але й стартувати без цих
          # двох йому нема сенсу.
          PAPIRUS_EMAIL: ${{ secrets.PAPIRUS_EMAIL }}
          PAPIRUS_PASSWORD: ${{ secrets.PAPIRUS_PASSWORD }}
          # Завантажувач за замовчуванням шукає psql у Homebrew — це шлях з
          # ноутбука. На раннері psql лежить у PATH.
          PSQL_BIN: psql
          LIST: ${{ steps.pick.outputs.list }}
        run: |
          set -euo pipefail

          if [ -z "${BACKUP_DB_URL:-}" ]; then
            echo "::error::Немає секрета SUPPLIER_FEED_DB_URL — заливати нема куди."
            exit 1
          fi

          # Кажемо про брак облікових даних ДО заливу й лише тоді, коли
          # e-suvenir справді в списку: інакше нічний прогін падав би на ньому
          # щоразу, коли хтось запустив руками сусіднє джерело.
          case " $LIST " in
            *" e-suvenir "*)
              if [ -z "${E_SUVENIR_EMAIL:-}" ] || [ -z "${E_SUVENIR_PASSWORD:-}" ]; then
                echo "::error::Немає секретів E_SUVENIR_EMAIL / E_SUVENIR_PASSWORD — без логіна API віддає публічні ціни."
                exit 1
              fi
              ;;
          esac
          case " $LIST " in
            *" berrytex "*)
              if [ -z "${BERRYTEX_EMAIL:-}" ] || [ -z "${BERRYTEX_PASSWORD:-}" ]; then
                echo "::error::Немає секретів BERRYTEX_EMAIL / BERRYTEX_PASSWORD — без логіна сайт показує роздріб."
                exit 1
              fi
              ;;
          esac
          case " $LIST " in
            *" papirus "*)
              if [ -z "${PAPIRUS_EMAIL:-}" ] || [ -z "${PAPIRUS_PASSWORD:-}" ]; then
                echo "::error::Немає секретів PAPIRUS_EMAIL / PAPIRUS_PASSWORD — кабінет віддає візитівку замість прайсу."
                exit 1
              fi
              ;;
          esac

          # Другий рубіж проти пароля в публічному лозі (перший — замальовування
          # самим GitHub). Ловимо і postgres://, і postgresql://.
          hide() { sed -E 's#postgres(ql)?://[^[:space:]]+#postgres://«приховано»#g'; }

          failed=""
          for s in $LIST; do
            echo "──────── $s ────────"
            # Один постачальник, що впав, не має зупиняти решту: у кожного своє
            # джерело, і зламаний Хорошоп не привід не оновити Тотобі.
            if out=$(node scripts/load-supplier-feed.mjs "$s" 2>&1 | hide); then
              # Рядки поступу обходу (їх сотні) до логу не тягнемо — лише підсумок.
              printf '%s\n' "$out" | grep -vE '^  пройдено ' | tail -12
            else
              printf '%s\n' "$out" | grep -vE '^  пройдено ' | tail -12
              echo "::error::$s — не залилось. Каталог у базі лишився попереднім."
              failed="$failed $s"
            fi
          done

          failed=$(echo "$failed" | sed 's/^ //')
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then
            echo "::error::Не залилось:$failed"
            exit 1
          fi
          echo "✓ Усі фіди на місці."

      - name: Сказати в Telegram, якщо не вийшло
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WATCHDOG_CHAT_IDS: ${{ secrets.WATCHDOG_CHAT_IDS }}
          FAILED: ${{ steps.load.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Мовчазний збій крона — це рівно та біда, від якої крон і рятує:
          # ціни перестають оновлюватись, а виглядає все як завжди.
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${WATCHDOG_CHAT_IDS:-}" ]; then
            echo "Секрети Telegram не налаштовані — повідомлення пропущено."
            exit 0
          fi
          # Один рядок навмисно: у YAML перенос затягнув би сюди відступ файлу.
          text="⚠️ Фіди постачальників не оновились: ${FAILED:-невідомо чому}. Ціни в пошуку постачальників лишились ті, що були. $RUN_URL"
          IFS=',' read -ra ids <<< "$WATCHDOG_CHAT_IDS"
          for id in "${ids[@]}"; do
            curl -sS -m 10 -o /dev/null \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${id// /}" \
              --data-urlencode "text=$text" || true
          done
