[build]
command = "npm run build"
publish = "dist"

# Пропустити білд, якщо пуш зачепив тільки те, що не потрапляє в зібраний сайт.
# Exit 0 = пропустити, exit 1 = білдити. Кожен білд коштує ~15 кредитів — див. docs/DEPLOY_POLICY.md.
# Немає кешованого коміта (перший білд) — білдимо, щоб не пропустити реальні зміни.
# Будь-який контекст, крім продакшену (deploy-preview від PR, branch-deploy),
# коштує ті самі ~15 кредитів, а користі не дає: PR-ів тут не було жодного за
# останні 100 деплоїв, усі 100 — production. Робот оновлення залежностей
# (.github/dependabot.yml) відкриватиме PR-и, і без цього рядка кожен із них
# перетворювався б на платну збірку. Перевірку PR-ів робить GitHub Actions, він
# безкоштовний. Порожній CONTEXT не чіпаємо — падаємо у звичайну логіку нижче.
#
# ЧОМУ scripts/*.mjs ТЕЖ ВИКЛЮЧЕНІ. Це перевірки, ратчети й разові міграції:
# вони крутяться в `npm run check`, у гаку пуша й у GitHub Actions, а в
# зібраний сайт не потрапляє жоден їхній рядок. Правка одного такого скрипта
# коштувала повної збірки — ~15 кредитів за зміну, яку користувач не побачить.
#
# ВИНЯТОК — attachment-preview-renderer.mjs. Єдиний із сімдесяти, який лежить
# у scripts/, але є входом збірки: vite.config.ts імпортує з нього
# renderFirstPagePreviewFiles. Якби він потрапив під загальне виключення, його
# правка мовчки не доїжджала б до проду — рівно та німа поломка, від якої всі
# інші перевірки й стережуть. Тому після загальної перевірки йде друга, вузька:
# `&&` віддає її код лише тоді, коли перша не знайшла інших змін.
#
# scripts/hooks — з тієї ж причини: commit-msg, post-commit і pre-push
# виконуються на машині розробника, Netlify їх не запускає ніколи.
ignore = '''
[ -n "$CONTEXT" ] && [ "$CONTEXT" != "production" ] && exit 0
[ -z "$CACHED_COMMIT_REF" ] && exit 1
git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ':(exclude)docs' ':(exclude)ops' ':(exclude)*.md' ':(exclude)scripts/*.sql' ':(exclude)scripts/*.mjs' ':(exclude)scripts/hooks' ':(exclude).github' &&
  git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- scripts/attachment-preview-renderer.mjs
'''

[build.environment]
# Node 24 (Active LTS «Krypton»). Ця версія керує І збіркою, І рантаймом усіх
# функцій — AWS_LAMBDA_JS_RUNTIME не закріплений навмисно, щоб не тримати два
# джерела правди.
#
# ЧОМУ ПІШЛИ З 20: вона померла 30 квітня 2026 — ні збірка, ні 42 функції
# більше не отримували латок безпеки від самого Node. Заразом двадцятка стала
# стелею для оновлень: supabase-js з 2.110 і pdfjs 6 просять уже 22+.
#
# ЧОМУ 24, А НЕ 22: станом на серпень 2026 живі лише 26 (Current), 24 (Active
# LTS) і 22 (Maintenance). Узяти 22 означало б завести цю саму задачу знову
# менш ніж за рік.
#
# Локальна версія тримається в .nvmrc тим самим числом — інакше вони розходяться
# мовчки, і те, що зібралось на машині, падає на проді.
NODE_VERSION = "24"

# Історія релізів пишеться на кожен УСПІШНИЙ деплой (подія onSuccess), а не
# після збірки: ці стадії розходяться, і запис на «збірка ок» клав би в історію
# реліз, якого користувачі не бачили. Плагін не валить деплой за жодних умов.
[[plugins]]
package = "/plugins/record-release"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

# ЛОКАЛЬНИЙ `netlify dev`. Без цього блоку CLI сам вгадує фреймворк і чекає на
# Vite за типовим портом 5173 — а наш Vite слухає 5199 (`devPort` у
# vite.config.ts). Наслідок був німий і дорогий: сервер піднімався, віддавав
# сторінку, а через хвилину помирав із «Timed out waiting for port '5173'», і
# жодну серверну функцію не можна було перевірити на живому застосунку —
# рівно те, що docs/CODEX_WORKFLOWS.md §0 велить робити для таких задач.
# Число тримати синхронно з vite.config.ts.
[dev]
command = "npm run dev"
targetPort = 5199
port = 8888
framework = "#custom"

[[redirects]]
from = "/api/fx-rates"
to = "/.netlify/functions/fx-rates"
status = 200
