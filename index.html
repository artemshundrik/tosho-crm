<!doctype html>
<html lang="uk" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">

    <link rel="icon" type="image/svg+xml" href="/favicon-light-v2.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark-v2.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light-v2.svg" />
    <link rel="shortcut icon" href="/favicon-light-v2.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Inter self-host: @fontsource-variable/inter імпортується в main.tsx,
         Vite інлайнить @font-face у бандл-CSS. Google Fonts CDN прибрано. -->
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToSho CRM</title>
    <!-- Тема ставиться ДО першого малювання: інакше сторінка встигає блимнути
         світлою й перефарбуватись, коли завантажиться застосунок. Логіка тут
         навмисно дублює src/lib/theme.ts — бандла на цей момент ще немає.
         Значення в сховищі: 'light' | 'dark' | 'system'; усе інше (зокрема
         порожньо) читається як 'system' і йде за налаштуванням пристрою. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var pref = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.themePreference = pref;
        } catch (e) {}
      })();
    </script>
</head>
  <body translate="no" class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
